<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Family - FamilyArchive</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-image-side" style="background-image: url('{{ url_for('static', filename='avatar_wife.jpg') }}');">
        </div>
        <div class="auth-form-side">
            <div class="auth-header">
                <a href="/" class="header-logo" style="margin-bottom: var(--space-12); display: inline-flex;">
                    <i data-lucide="layers" style="margin-right: var(--space-2); width: 24px; height: 24px;"></i>
                    FamilyArchive
                </a>
                <h1 class="auth-title">Join your family.</h1>
                <p class="auth-subtitle">Enter your invitation code to connect.</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-messages" style="margin-bottom: var(--space-6);">
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="/join" method="POST">
                <div class="form-group">
                    <label for="invite_code" class="form-label">Invitation Code</label>
                    <input type="text" id="invite_code" name="invite_code" class="form-control" placeholder="e.g. AB12CD" required style="text-transform: uppercase;">
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="example@mail.com" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Set Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Create a password" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat your password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: var(--space-4); margin-top: var(--space-4);">Activate Profile</button>
            </form>

            <div style="margin-top: var(--space-8); text-align: center; color: var(--text-secondary); font-size: var(--text-sm);">
                Already activated? <a href="/login" style="color: var(--text-primary); font-weight: 500; text-decoration: underline;">Sign In</a>
            </div>
        </div>
    </div>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
